version: 2
updates:

  # Maintain dependencies for .NET
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/SDV.GraphGenerator"
    schedule:
      interval: "weekly"

  # Maintain versions of the actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
